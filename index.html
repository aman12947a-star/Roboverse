<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini AI Pro - Aditi</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg-color: #131314;
            --user-msg-bg: #2b2a2a;
            --ai-msg-bg: transparent;
            --text-color: #e3e3e3;
            --input-bg: #1e1f20;
            --accent-blue: #4285f4;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            padding: 15px 25px;
            font-size: 1.5rem;
            font-weight: bold;
            background: linear-gradient(90deg, #4285f4, #9b72cb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            border-bottom: 1px solid #333;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .message {
            max-width: 85%;
            padding: 10px 18px;
            border-radius: 20px;
            line-height: 1.6;
            word-wrap: break-word;
        }

        .user-message {
            align-self: flex-end;
            background-color: var(--user-msg-bg);
            border-bottom-right-radius: 4px;
        }

        .ai-message {
            align-self: flex-start;
            width: 100%;
        }

        /* Styling for AI text (Markdown) */
        .ai-message pre {
            background: #000;
            padding: 15px;
            border-radius: 12px;
            overflow-x: auto;
            border: 1px solid #444;
        }

        .ai-message code {
            font-family: 'Courier New', Courier, monospace;
            color: #ffcc00;
        }

        .input-area {
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .input-wrapper {
            width: 100%;
            max-width: 800px;
            background: var(--input-bg);
            border-radius: 30px;
            display: flex;
            padding: 8px 20px;
            border: 1px solid #444;
        }

        input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            font-size: 16px;
            outline: none;
            padding: 10px;
        }

        button {
            background: none;
            border: none;
            color: var(--accent-blue);
            cursor: pointer;
            font-size: 20px;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.1);
        }

        .dots:after { content: '...'; animation: flash 1s infinite; }
        @keyframes flash { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    </style>
</head>
<body>

    <header>Gemini Pro 1.5</header>

    <div id="chat-container">
        <div class="message ai-message">Namaste! Main aapki kaise madad kar sakta hoon?</div>
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <input type="text" id="user-input" placeholder="Yahan kuch likhein..." autocomplete="off">
            <button id="send-btn">➤</button>
        </div>
    </div>

    <script>
        // Aapki provided API Key yahan set kar di gayi hai
        const API_KEY = "AIzaSyBFXS5bq-eF2zhdXu8pO_U0mrG2Rz94Ei4"; 
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        let chatHistory = [];

        async function fetchAIResponse(userText) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;
            
            chatHistory.push({ role: "user", parts: [{ text: userText }] });

            const response = await fetch(url, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ contents: chatHistory })
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error.message || 'API Request Failed');
            }
            
            const data = await response.json();
            const aiText = data.candidates[0].content.parts[0].text;

            chatHistory.push({ role: "model", parts: [{ text: aiText }] });

            return aiText;
        }

        function appendMessage(text, isUser) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message');
            msgDiv.classList.add(isUser ? 'user-message' : 'ai-message');
            
            if (isUser) {
                msgDiv.innerText = text;
            } else {
                msgDiv.innerHTML = marked.parse(text);
            }

            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTo({ top: chatContainer.scrollHeight, behavior: 'smooth' });
            return msgDiv;
        }

        async function handleChat() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, true);
            userInput.value = "";
            
            const loadingMsg = appendMessage("Thinking", false);
            loadingMsg.classList.add('dots');
            sendBtn.disabled = true;

            try {
                const aiResponse = await fetchAIResponse(text);
                loadingMsg.innerHTML = marked.parse(aiResponse);
                loadingMsg.classList.remove('dots');
            } catch (error) {
                loadingMsg.classList.remove('dots');
                loadingMsg.innerText = "Error: " + error.message;
                console.error(error);
            } finally {
                sendBtn.disabled = false;
            }
        }

        sendBtn.addEventListener('click', handleChat);
        userInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleChat(); });
    </script>
</body>
</html>
